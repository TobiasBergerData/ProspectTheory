services:
  - type: web
    name: prospecttheory-api
    runtime: python
    plan: free
    # LFS-Pull explizit triggern - sonst sieht Render nur die 130-Byte-Pointer-Dateien
    # statt der echten 100-MB-JSONs. Bisher hat Render einen alten Cache-Stand serviert.
    buildCommand: git lfs install --local && git lfs pull && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_DIR
        value: ./data/processed
      - key: PYTHON_VERSION
        value: "3.11"
