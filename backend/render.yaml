services:
  - type: web
    name: prospecttheory-api
    runtime: python
    plan: free
    # Tobias 2026-05-06: One-Liner mit && (Render-Dashboard-Feld nimmt nur Single-Line).
    # `python -u` für unbuffered Output, sonst wirken die Inject-Scripts hängend.
    # `git lfs` weggelassen — nicht installiert auf Render-Container, war Fehlerquelle.
    buildCommand: pip install -r requirements.txt && python -u build_db.py && python -u inject_shot_creation_spectrum.py && python -u inject_leverage_efficiency.py && python -u inject_skill_curve.py && python -u inject_ogbpm.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATA_DIR
        value: ./data/processed
      - key: PYTHON_VERSION
        value: "3.11"
