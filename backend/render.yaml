services:
  - type: web
    name: prospecttheory-api
    runtime: python
    plan: free
    # Tobias 2026-05-05: Build-on-Deploy.
    # Source-JSONs (alle <90 MB → kein LFS noetig) sind im Repo.
    # build_db.py mergt sie zu prospecttheory.db auf Render-Disk (~30-60s).
    # Vorteile: kein LFS-Bandwidth-Limit, verlustfreie volle DB.
    # Falls LFS noch fuer andere Files genutzt: Pull bleibt drin als Fallback.
    buildCommand: |
      git lfs install --local || true
      git lfs pull || true
      pip install -r requirements.txt
      python build_db.py
      # Tobias 2026-05-05: Mind-Tab + Skill-Curve + OGBPM benötigen post-DB-Inject.
      # Reihenfolge wichtig: shotCreation muss VOR leverageEff laufen (Voraussetzung).
      python inject_shot_creation_spectrum.py
      python inject_leverage_efficiency.py
      python inject_skill_curve.py
      python inject_ogbpm.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_DIR
        value: ./data/processed
      - key: PYTHON_VERSION
        value: "3.11"
