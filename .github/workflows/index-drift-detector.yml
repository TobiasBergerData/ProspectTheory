name: Index-Drift Detector

# Verhindert Wiederholung der Sprint-Recovery-Krise (2026-06-11).
# Damals waren Code-Files aus Git-Index verloren gegangen, ohne dass es
# bemerkt wurde — Render-Build-Cache hatte den Service am Leben gehalten.
# Dieser Workflow läuft bei jedem Push und prüft kritische Files auf
# Existenz im Remote.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-critical-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify backend Python code exists
        run: |
          set -e
          critical=(
            backend/main.py
            backend/build_db.py
            backend/build.sh
            backend/requirements.txt
            backend/inject_added_wins.py
            backend/inject_draft_risk.py
            backend/inject_game_logs.py
            backend/inject_leverage_efficiency.py
            backend/inject_mind_metrics.py
            backend/inject_nba_role.py
            backend/inject_ogbpm.py
            backend/inject_position_overrides.py
            backend/inject_season_advanced.py
            backend/inject_shooting_m1.py
            backend/inject_shot_creation_spectrum.py
            backend/inject_skill_curve.py
            backend/name_utils.py
            render.yaml
          )
          missing=()
          for f in "${critical[@]}"; do
            if [[ ! -f "$f" ]]; then
              missing+=("$f")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "FATAL: Critical files missing in Remote:"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "Sprint-Recovery-Krise wiederholt sich. Index-Drift!"
            echo "Lokal verifizieren mit: git status; git ls-tree -r origin/main --name-only"
            exit 1
          fi
          echo "✓ All ${#critical[@]} critical backend files present"

      - name: Verify frontend code exists
        run: |
          set -e
          critical=(
            frontend/src/App.jsx
            frontend/src/main.jsx
            frontend/src/index.css
            frontend/package.json
            frontend/index.html
            frontend/vite.config.js
          )
          missing=()
          for f in "${critical[@]}"; do
            if [[ ! -f "$f" ]]; then
              missing+=("$f")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "FATAL: Frontend files missing:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "✓ All ${#critical[@]} critical frontend files present"

      - name: Verify data artifacts (gz splits)
        run: |
          set -e
          # Sprint-5.12/13: Artefakte sind gzip-Splits (api_profiles_part*.json.gz).
          # Anzahl kann mit Datenwachstum variieren → mindestens 3 Parts, jeder
          # plausibel groß (>3 MB komprimiert). Search-Index muss ebenfalls da sein.
          shopt -s nullglob
          parts=(backend/data/processed/api_profiles_part*.json.gz)
          if [[ ${#parts[@]} -lt 3 ]]; then
            echo "FATAL: nur ${#parts[@]} api_profiles_part*.json.gz gefunden — Pipeline-Output nicht synced"
            exit 1
          fi
          for f in "${parts[@]}"; do
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
            if [[ $size -lt 3000000 ]]; then
              echo "FATAL: $f is suspiciously small ($size bytes) — truncated?"
              exit 1
            fi
          done
          if [[ ! -f backend/data/processed/api_search_index.json.gz ]]; then
            echo "FATAL: api_search_index.json.gz missing"
            exit 1
          fi
          echo "✓ ${#parts[@]} api_profiles_part*.json.gz + search index present and reasonably sized"

      - name: Verify documentation completeness
        run: |
          set -e
          docs=(
            docs/ARCHITECTURE.md
            docs/METHODS_DICT.md
            docs/SCHEMA_CONTRACT.md
            docs/ADR/001-polyrepo-architecture.md
            docs/sprints/SPRINT_3_0_DESIGN.md
          )
          missing=()
          for f in "${docs[@]}"; do
            if [[ ! -f "$f" ]]; then
              missing+=("$f")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "WARN: Documentation files missing:"
            printf '  - %s\n' "${missing[@]}"
            echo "(non-blocking, aber Doku-Erosion)"
          else
            echo "✓ All documentation present"
          fi
