    <!-- Horizontal cross seam - curves with the bell shape -->
    <path d="M52 120 C70 105, 130 105, 148 120" stroke-width="7"/>
    <!-- Upper arc seam -->
    <path d="M68 42 C80 75, 120 75, 132 42" stroke-width="7"/>
    <!-- Lower-left arc -->
    <path d="M35 160 C50 125, 70 135, 85 180" stroke-width="6"/>
    <!-- Lower-right arc -->
