<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background with rounded corners -->
  <rect width="100" height="100" rx="18" fill="#0d1117"/>

  <!-- Bell curve (Gaussian) -->
  <path d="M8 90 C8 90, 28 12, 50 12 C72 12, 92 90, 92 90"
        fill="none" stroke="#f97316" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Basketball seams integrated into the bell curve area -->
  <!-- Vertical seam: top of curve to baseline -->
  <line x1="50" y1="12" x2="50" y2="90"
        stroke="#f97316" stroke-width="3.5"
        stroke-linecap="round" opacity="0.75"/>

  <!-- Horizontal seam across the mid-section -->
  <line x1="14" y1="58" x2="86" y2="58"
        stroke="#f97316" stroke-width="3.5"
        stroke-linecap="round" opacity="0.75"/>

  <!-- Top arc seam (upper panel of basketball) -->
  <path d="M28 16 C36 40, 64 40, 72 16"
        fill="none" stroke="#f97316" stroke-width="3.5"
        stroke-linecap="round" opacity="0.75"/>
</svg>
