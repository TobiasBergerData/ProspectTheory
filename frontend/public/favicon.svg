<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Solid orange background -->
  <rect width="100" height="100" rx="14" fill="#f97316"/>
  <!-- Cut-out bell curve + basketball seams (dark = "carved out") -->
  <!-- Bell curve outline carved from the orange -->
  <path d="M10 88 C10 88, 28 14, 50 14 C72 14, 90 88, 90 88"
        fill="none" stroke="#0d1117" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Vertical seam -->
  <line x1="50" y1="14" x2="50" y2="88"
        stroke="#0d1117" stroke-width="4.5"
        stroke-linecap="round"/>
  <!-- Horizontal seam -->
  <line x1="18" y1="56" x2="82" y2="56"
        stroke="#0d1117" stroke-width="4.5"
        stroke-linecap="round"/>
  <!-- Top arc seam -->
  <path d="M30 18 C38 44, 62 44, 70 18"
        fill="none" stroke="#0d1117" stroke-width="4.5"
        stroke-linecap="round"/>
  <!-- Bottom left arc -->
  <path d="M18 72 C28 56, 36 62, 38 88"
        fill="none" stroke="#0d1117" stroke-width="3.5"
        stroke-linecap="round"/>
  <!-- Bottom right arc -->
  <path d="M82 72 C72 56, 64 62, 62 88"
        fill="none" stroke="#0d1117" stroke-width="3.5"
        stroke-linecap="round"/>
</svg>
