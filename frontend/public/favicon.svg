<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" rx="28" fill="#0d1117"/>
  <g fill="none" stroke="#f97316" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bell curve outer shape -->
    <path d="M20 180 C20 180, 50 140, 60 90 C70 40, 85 20, 100 20 C115 20, 130 40, 140 90 C150 140, 180 180, 180 180" stroke-width="9"/>
    <!-- Vertical center seam -->
