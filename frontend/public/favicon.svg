<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="14" fill="#0d1117"/>

  <!-- Bell curve (outer shape) -->
  <path d="M8 92 C12 75, 25 12, 50 12 C75 12, 88 75, 92 92"
        fill="none" stroke="#f97316" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Basketball seams -->
  <!-- 1. Vertical center seam: peak to base -->
  <line x1="50" y1="12" x2="50" y2="92"
        stroke="#f97316" stroke-width="4" stroke-linecap="round"/>

  <!-- 2. Horizontal seam: follows the curve width at ~55% height -->
  <path d="M22 55 C35 55, 65 55, 78 55"
        fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>

  <!-- 3. Upper arc seam: curves between the bell curve sides above the horizontal -->
  <path d="M30 22 C38 46, 62 46, 70 22"
        fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>

  <!-- 4. Lower-left arc: curves from bell curve left side inward -->
  <path d="M15 78 C24 60, 35 65, 42 92"
        fill="none" stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 5. Lower-right arc: mirrors lower-left -->
  <path d="M85 78 C76 60, 65 65, 58 92"
        fill="none" stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>
</svg>
