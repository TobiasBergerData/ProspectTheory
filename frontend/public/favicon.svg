<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="14" fill="#0d1117"/>

  <!-- Bell curve (outer shape) -->
  <path d="M10 90 C14 72, 28 14, 50 14 C72 14, 86 72, 90 90"
        fill="none" stroke="#f97316" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Vertical seam: peak to base -->
  <line x1="50" y1="14" x2="50" y2="90"
        stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Horizontal seam at ~52% height -->
  <line x1="22" y1="52" x2="78" y2="52"
        stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Upper arc: wider, connecting the two sides of bell above horizontal -->
  <path d="M28 20 C36 48, 64 48, 72 20"
        fill="none" stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Lower-left arc: from bell curve inward to baseline -->
  <path d="M17 74 C28 56, 38 62, 44 90"
        fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>

  <!-- Lower-right arc: mirror -->
  <path d="M83 74 C72 56, 62 62, 56 90"
        fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
</svg>
